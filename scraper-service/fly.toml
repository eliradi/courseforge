# Example Fly.io deployment for the Aceversity scraper service.
#   fly launch --no-deploy --copy-config
#   fly secrets set SCRAPER_SERVICE_SECRET=$(openssl rand -hex 32)
#   fly deploy
app = "aceversity-scraper"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  MAX_CONCURRENT_CONTEXTS = "3"
  DEFAULT_TIMEOUT_MS = "30000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 6
    soft_limit = 3

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# Chromium is memory-hungry: 1GB is the practical floor for 3 concurrent contexts.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
